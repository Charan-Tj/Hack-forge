services:
  kavachforge:
    build: .
    image: kavachforge:latest
    volumes:
      - ./artifacts:/app/artifacts
      - ./cache:/app/cache
    ports:
      - "8777:8777"
    environment:
      # Set a key to use a live model; otherwise the offline brain runs.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - KAVACH_LLM_PROVIDER=${KAVACH_LLM_PROVIDER:-}
      - KAVACH_LLM_MODEL=${KAVACH_LLM_MODEL:-}
    # Default: run the full demo. Override, e.g.:
    #   docker compose run --rm kavachforge run tinyimg
    command: ["demo"]
